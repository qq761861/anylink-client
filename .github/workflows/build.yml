name: Build

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: node --experimental-transform-types --import ./tests/_register.mjs --test "tests/*.test.mjs"

  build:
    needs: test
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            platform: win
            arch: amd64
          - os: windows-latest
            platform: win
            arch: 386
          - os: windows-latest
            platform: win
            arch: arm64
          # macOS
          - os: macos-latest
            platform: mac
            arch: amd64
          - os: macos-latest
            platform: mac
            arch: arm64
          # Linux
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: arm
          - os: ubuntu-latest
            platform: linux
            arch: arm64

    env:
      AGENT_RELEASE_TAG: v1.0.1
      AGENT_RELEASE_REPO: jarryxy/anylink-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 1000000

      - name: Download vpn agent binary
        run: node scripts/download-agent.js ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Build with electron-builder
        shell: bash
        env:
          AGENT_ARCH: ${{ matrix.arch }}
        run: |
          ARCH="${{ matrix.arch }}"
          PLATFORM="${{ matrix.platform }}"

          # map electron-builder args
          case "$ARCH" in
            amd64) B_FLAG="--x64" ;;
            386)   B_FLAG="--ia32" ;;
            arm64) B_FLAG="--arm64" ;;
            arm)   B_FLAG="--armv7l" ;;
          esac

          case "$PLATFORM" in
            win)   B_PLATFORM="--win" ;;
            mac)   B_PLATFORM="--mac" ;;
            linux) B_PLATFORM="--linux" ;;
          esac

          npx cross-env BUILD_TARGET=clean node .electron-vue/build.js
          npx cross-env AGENT_ARCH="$ARCH" electron-builder "$B_PLATFORM" "$B_FLAG" --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anylink-client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/*.exe
            build/*.dmg
            build/*.tar.gz
            build/*.AppImage
          if-no-files-found: ignore
